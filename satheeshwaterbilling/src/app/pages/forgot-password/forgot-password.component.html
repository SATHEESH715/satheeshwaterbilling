<div class="container">
	<h2>Forgot Password</h2>
	<form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
		<div>
			<label>Email or Mobile</label>
			<input formControlName="emailOrMobile" type="text" placeholder="Enter email or mobile" />
		</div>
		<div *ngIf="error" class="error">{{ error }}</div>
		<div *ngIf="success" style="color: #0077c8; margin-bottom: 1rem;">{{ success }}</div>
		<button type="submit" [disabled]="loading">{{ loading ? 'Sending...' : 'Send OTP' }}</button>
	</form>
	<div class="links">
		<a routerLink="/login">Back to Login</a>
	</div>
</div>
