<div class="container">
	<h2>Reset Password</h2>
	<form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
		<div>
			<label>Email or Mobile</label>
			<input formControlName="emailOrMobile" type="text" placeholder="Enter email or mobile" />
		</div>
		<div>
			<label>OTP</label>
			<input formControlName="otp" type="text" maxlength="6" placeholder="Enter OTP" />
		</div>
		<div>
			<label>New Password</label>
			<input formControlName="newPassword" type="password" placeholder="Enter new password" />
		</div>
		<div>
			<label>Confirm Password</label>
			<input formControlName="confirmPassword" type="password" placeholder="Confirm new password" />
		</div>
		<div *ngIf="resetForm.errors?.['mismatch'] && resetForm.get('confirmPassword')?.touched" class="error">
			Passwords do not match.
		</div>
		<div *ngIf="error" class="error">{{ error }}</div>
		<div *ngIf="success" style="color: #0077c8; margin-bottom: 1rem;">{{ success }}</div>
		<button type="submit" [disabled]="loading">{{ loading ? 'Resetting...' : 'Reset Password' }}</button>
	</form>
	<div class="links">
		<a routerLink="/login">Back to Login</a>
	</div>
</div>
