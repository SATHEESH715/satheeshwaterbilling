<div class="container">
	<h2>Verify OTP</h2>
	<form [formGroup]="otpForm" (ngSubmit)="onSubmit()">
		<div>
			<label>Email or Mobile</label>
			<input formControlName="emailOrMobile" type="text" placeholder="Enter email or mobile" />
		</div>
		<div>
			<label>OTP</label>
			<input formControlName="otp" type="text" maxlength="6" placeholder="Enter OTP" />
		</div>
		<div *ngIf="error" class="error">{{ error }}</div>
		<button type="submit" [disabled]="loading">{{ loading ? 'Verifying...' : 'Verify OTP' }}</button>
	</form>
	<div class="links">
		<a routerLink="/login">Back to Login</a>
	</div>
</div>
