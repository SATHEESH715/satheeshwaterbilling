<!-- src/app/pages/contact/contact.component.html -->

<div class="contact-page-bg">
  <div class="contact-card">
    <h2>Contact Us</h2>
    <form (ngSubmit)="sendMessage()" #contactForm="ngForm" autocomplete="on">
      <div class="form-group">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" [(ngModel)]="name" required />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" [(ngModel)]="email" required />
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" [(ngModel)]="message" required></textarea>
      </div>
      <button class="contact-btn" type="submit" [disabled]="!contactForm.valid">Send</button>
    </form>
  </div>
</div>
