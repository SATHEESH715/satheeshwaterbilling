
<div class="login-page-bg">
	<div class="login-card">
		<div class="login-header">
			<img src="assets/angular.svg" alt="Logo" class="login-logo" />
			<h2>Sign In to Your Account</h2>
		</div>
		<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" autocomplete="on">
			<div class="form-group">
				<label for="emailOrMobile">Email or Mobile</label>
				<input id="emailOrMobile" formControlName="emailOrMobile" type="text" placeholder="Enter email or mobile" [class.invalid]="loginForm.get('emailOrMobile')?.invalid && loginForm.get('emailOrMobile')?.touched" />
			</div>
			<div class="form-group">
				<label for="password">Password</label>
				<input id="password" formControlName="password" type="password" placeholder="Enter password" [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" />
			</div>
			<div *ngIf="error" class="error">{{ error }}</div>
			<button class="login-btn" type="submit" [disabled]="loading || loginForm.invalid">{{ loading ? 'Logging in...' : 'Login' }}</button>
		</form>
			<div class="login-links" style="margin-top:1.2rem; text-align:center; width:100%;">
				<a routerLink="/register" style="font-weight:500; color:#6366f1; text-decoration:underline;">Create Account</a>
				<span style="margin:0 0.5rem; color:#64748b;">|</span>
				<a routerLink="/forgot-password" style="font-weight:500; color:#6366f1; text-decoration:underline;">Forgot Password?</a>
			</div>
	</div>
</div>
