<div class="container">
	<h2>Category Master</h2>
	<form [formGroup]="categoryForm" (ngSubmit)="onSubmit()">
		<div>
			<label>Name</label>
			<input formControlName="name" type="text" placeholder="Category name" />
		</div>
		<div>
			<label>Description</label>
			<input formControlName="description" type="text" placeholder="Description" />
		</div>
		<div>
			<label>Price per unit</label>
			<input formControlName="price" type="number" min="0" step="0.01" placeholder="Price" />
		</div>
		<div>
			<label>Stock</label>
			<input formControlName="stock" type="number" min="0" placeholder="Stock" />
		</div>
		<div>
			<label>Image URL</label>
			<input formControlName="imageUrl" type="text" placeholder="Image URL" />
		</div>
		<div *ngIf="error" class="error">{{ error }}</div>
		<button type="submit" [disabled]="loading">{{ editingId ? (loading ? 'Updating...' : 'Update') : (loading ? 'Adding...' : 'Add Category') }}</button>
		<button type="button" *ngIf="editingId" (click)="cancelEdit()" style="margin-left:1rem;">Cancel</button>
	</form>

	<h3 style="margin-top:2rem;">Categories</h3>
	<table style="width:100%; border-collapse:collapse; margin-top:1rem;">
		<thead>
			<tr style="background:#e3f2fd;">
				<th style="padding:8px;">Name</th>
				<th style="padding:8px;">Description</th>
				<th style="padding:8px;">Price</th>
				<th style="padding:8px;">Stock</th>
				<th style="padding:8px;">Image</th>
				<th style="padding:8px;">Actions</th>
			</tr>
		</thead>
		<tbody>
			<tr *ngFor="let cat of categories">
				<td style="padding:8px;">{{ cat.name }}</td>
				<td style="padding:8px;">{{ cat.description }}</td>
				<td style="padding:8px;">₹{{ cat.price }}</td>
				<td style="padding:8px;">{{ cat.stock }}</td>
				<td style="padding:8px;">
					<img *ngIf="cat.imageUrl" [src]="cat.imageUrl" alt="img" style="height:40px; border-radius:6px;" />
				</td>
				<td style="padding:8px;">
					<button type="button" (click)="editCategory(cat)" class="btn" style="margin-right:0.5rem;">Edit</button>
					<button type="button" (click)="deleteCategory(cat.id)" class="btn" style="background:#d32f2f;">Delete</button>
				</td>
			</tr>
			<tr *ngIf="categories.length === 0">
				<td colspan="6" style="text-align:center; color:#888;">No categories found.</td>
			</tr>
		</tbody>
	</table>
</div>
