<header class="tw-header tw-header-fixed teamwater-header">
  <div class="tw-header-content teamwater-header-content">
    <div class="teamwater-header-left">
      <span class="tw-logo" style="display:inline-block;vertical-align:middle;width:54px;height:54px;">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" width="54" height="54">
          <path d="M32 4C32 4 12 28 12 42C12 53.0457 21.9543 62 33 62C44.0457 62 54 53.0457 54 42C54 28 32 4 32 4Z" fill="#00b4d8" stroke="#0077c8" stroke-width="3"/>
          <ellipse cx="32" cy="44" rx="12" ry="10" fill="#e0f7fa"/>
        </svg>
      </span>
    </div>
    <div class="teamwater-header-center">
      <h1>SatheeshWater</h1>
      <span>Best Mineral Water Dealer</span>
    </div>
    <nav class="tw-nav teamwater-header-right">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="/about" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">About</a>
      <a routerLink="/services" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Services</a>
      <a routerLink="/contact" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Contact</a>
      <a routerLink="/gallery" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Gallery</a>
      <a routerLink="/billing" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Billing</a>
      <a routerLink="/category" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Category/Product</a>
      <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Admin Dashboard</a>
      <a routerLink="/login" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Login</a>
      <a routerLink="/register" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Register</a>
      <a routerLink="/forgot-password" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Forgot Password</a>
    </nav>
  </div>
</header>
